<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plugins - RaspiPot</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <style>
      .plugin-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 1.5rem;
      }
      .plugin-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.5rem;
        transition: border-color 0.2s;
        position: relative;
      }
      .plugin-card.enabled {
        border-color: var(--success);
      }
      .plugin-name {
        font-size: 1.25rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
        display: block;
      }
      .plugin-version {
        color: var(--primary);
        font-size: 0.8rem;
        font-weight: bold;
      }
      .plugin-desc {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin: 1rem 0;
        line-height: 1.4;
      }
      .plugin-actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .btn-toggle {
        flex: 1;
        border: none;
        padding: 0.5rem;
        border-radius: 0.5rem;
        cursor: pointer;
        font-weight: bold;
        background: var(--border);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
      }
      .btn-toggle.active {
        background: var(--success);
      }
      .btn-uninstall {
        background: rgba(239, 71, 111, 0.1);
        color: var(--danger);
        border: none;
        padding: 0.5rem;
        border-radius: 0.5rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <aside>
      <div class="brand">
        <span class="material-icons text-primary">memory</span>
        <span class="name">RaspiPot</span>
      </div>
      <nav>
        <a href="/" class="nav-item"><span class="material-icons">dashboard</span> Overview</a>
        <a href="/processes.html" class="nav-item"
          ><span class="material-icons">settings_applications</span> Processes</a
        >
        <a href="/services.html" class="nav-item"
          ><span class="material-icons">layers</span> Services</a
        >
        <a href="/pihole.html" class="nav-item"
          ><span class="material-icons">security</span> Pi-hole</a
        >
        <a href="/gpio.html" class="nav-item"
          ><span class="material-icons">settings_input_component</span> GPIO</a
        >
        <a href="/network.html" class="nav-item"
          ><span class="material-icons">router</span> Network</a
        >
        <a href="/plugins.html" class="nav-item active"
          ><span class="material-icons">extension</span> Plugins</a
        >
        <a href="/terminal.html" class="nav-item"
          ><span class="material-icons">terminal</span> Terminal</a
        >
        <a href="/files.html" class="nav-item"
          ><span class="material-icons">folder</span> Explorer</a
        >
        <a href="/settings.html" class="nav-item"
          ><span class="material-icons">settings</span> Settings</a
        >
      </nav>
    </aside>

    <main>
      <header>
        <h1>Plugin Manager</h1>
        <button
          class="btn-action"
          style="
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
          "
          onclick="
            alert(
              'Plugin installation via web is coming soon. Please place plugins in the /plugins folder.'
            )
          "
        >
          <span class="material-icons">add</span> Install
        </button>
      </header>

      <div id="pluginGrid" class="plugin-grid">
        <!-- Data here -->
      </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/app.js"></script>
    <script>
      const grid = document.getElementById('pluginGrid');

      async function loadPlugins() {
        try {
          const res = await fetch('/api/plugins');
          const data = await res.json();
          if (data.success) renderPlugins(data.plugins);
        } catch (e) {
          console.error('Load plugins failed', e);
        }
      }

      function renderPlugins(plugins) {
        grid.innerHTML =
          plugins
            .map(
              p => `
                <div class="plugin-card ${p.enabled ? 'enabled' : ''}">
                    <span class="plugin-name">${p.manifest.name} <span class="plugin-version">v${p.manifest.version}</span></span>
                    <div class="plugin-desc">${p.manifest.description || 'No description provided.'}</div>
                    <div style="font-size: 0.75rem; color: var(--text-muted);">Author: ${p.manifest.author || 'Unknown'}</div>
                    <div class="plugin-actions">
                        <button class="btn-toggle ${p.enabled ? 'active' : ''}" onclick="togglePlugin('${p.name}', ${p.enabled})">
                            <span class="material-icons">${p.enabled ? 'pause' : 'play_arrow'}</span>
                            ${p.enabled ? 'Disable' : 'Enable'}
                        </button>
                        <button class="btn-uninstall" onclick="uninstallPlugin('${p.name}')">
                            <span class="material-icons">delete</span>
                        </button>
                    </div>
                </div>
            `
            )
            .join('') ||
          '<div style="padding: 2rem; text-align: center; width: 100%;">No plugins found.</div>';
      }

      async function togglePlugin(name, current) {
        const action = current ? 'disable' : 'enable';
        await fetch(`/api/plugins/${name}/${action}`, { method: 'POST' });
        loadPlugins();
      }

      async function uninstallPlugin(name) {
        if (confirm(`Uninstall "${name}"?`)) {
          await fetch(`/api/plugins/${name}`, { method: 'DELETE' });
          loadPlugins();
        }
      }

      loadPlugins();
    </script>
  </body>
</html>
